name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check backend/ ml/ shared/

      - name: Mypy type check (shared)
        run: uv run mypy shared/amia_shared/

      - name: Mypy type check (backend)
        run: uv run mypy backend/app/

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        # Tests are added per version. This step passes vacuously until V1.
        continue-on-error: true

  data-generator-smoke:
    name: Data generator smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Generate 7 days of synthetic data (fast smoke test)
        run: |
          uv run scripts/generate_data.py --days 7 --seed 0 --output /tmp/amia_smoke
          test -f /tmp/amia_smoke/sensor_readings.parquet
          test -f /tmp/amia_smoke/failure_events.json
          echo "Smoke test passed"

  frontend-typecheck:
    name: Frontend type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check
        # Frontend scaffold is minimal in V0, tsc will pass once tsconfig.json is added in V1.
        continue-on-error: true
