name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check backend/ ml/ shared/ eval/ scripts/

      - name: Mypy type check (shared)
        run: uv run mypy shared/amia_shared/

      - name: Mypy type check (backend)
        run: uv run mypy backend/app/

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    needs: python-lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: amia
          POSTGRES_PASSWORD: amia_dev
          POSTGRES_DB: amia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amia -d amia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Run Alembic migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest backend/tests/ -v --tb=short

  data-generator-smoke:
    name: Data generator smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Generate 7 days of synthetic data (fast smoke test)
        run: |
          uv run scripts/generate_data.py --days 7 --seed 0 --output /tmp/amia_smoke
          test -f /tmp/amia_smoke/sensor_readings.parquet
          test -f /tmp/amia_smoke/failure_events.json
          echo "Smoke test passed"

  frontend-checks:
    name: Frontend type check & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint
