[project]
name = "amia-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "amia-shared",
    "anthropic>=0.25",
    "sentence-transformers>=2.7",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "pypdf>=4.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "langchain-text-splitters>=0.2",
    "qdrant-client>=1.18.0",
    "openai-agents>=0.17.5",
    "redis>=8.0.0",
]

[project.scripts]
amia-backend = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
amia-shared = { workspace = true }
