[project]
name = "amia-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "amia-shared",
    "anthropic>=0.25",
    "sentence-transformers>=2.7",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "langchain-text-splitters>=0.2",
    "qdrant-client>=1.18.0",
    "redis>=8.0.0",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "xgboost>=2.0",
    "mlflow>=2.12",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "langfuse>=2.0",
    # Requerido por langfuse.langchain.CallbackHandler (no se importa directo)
    "langchain>=0.3",
    "alembic>=1.18.4",
    "structlog>=26.1.0",
    "prometheus-fastapi-instrumentator>=0.22",
    # shap is optional — install manually if Python < 3.11: uv pip install "shap>=0.42,<0.52"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
]

[project.scripts]
amia-backend = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
amia-shared = { workspace = true }
