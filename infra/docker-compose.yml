services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: amia-postgres
    environment:
      POSTGRES_USER: amia
      POSTGRES_PASSWORD: amia_dev
      POSTGRES_DB: amia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amia -d amia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: amia-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Added in V2 ──────────────────────────────────────────────────────────
  # mlflow:
  #   image: ghcr.io/mlflow/mlflow:v2.12.0
  #   container_name: amia-mlflow
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://amia:amia_dev@postgres:5432/amia
  #     MLFLOW_ARTIFACT_ROOT: /mlartifacts
  #   volumes:
  #     - mlflow_artifacts:/mlartifacts
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   command: >
  #     mlflow server
  #     --host 0.0.0.0
  #     --port 5000
  #     --backend-store-uri postgresql+psycopg2://amia:amia_dev@postgres:5432/amia
  #     --default-artifact-root /mlartifacts

  # ── Added in V5 ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: amia-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: amia-grafana
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/amia_api.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ── Added in V4 ──────────────────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:2
    container_name: amia-langfuse
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://amia:amia_dev@postgres:5432/amia
      NEXTAUTH_SECRET: dev_secret_changeme
      NEXTAUTH_URL: http://localhost:3001
      SALT: dev_salt_changeme
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  # mlflow_artifacts:
