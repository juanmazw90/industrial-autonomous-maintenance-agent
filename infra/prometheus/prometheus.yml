global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: amia

scrape_configs:
  - job_name: amia-backend
    metrics_path: /prom-metrics
    static_configs:
      # host.docker.internal resuelve al host en Docker Desktop (Mac/Windows).
      # En Linux usar: extra_hosts: ["host.docker.internal:host-gateway"] en docker-compose.
      - targets:
          - host.docker.internal:8000
    relabel_configs:
      - target_label: service
        replacement: amia-backend
