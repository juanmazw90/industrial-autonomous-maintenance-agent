[project]
name = "amia-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyarrow>=15.0",
    "mlflow>=2.12",
    "amia-shared",
]

[project.scripts]
generate-data = "amia_ml.synthetic.generator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amia_ml"]

[tool.uv.sources]
amia-shared = { workspace = true }
